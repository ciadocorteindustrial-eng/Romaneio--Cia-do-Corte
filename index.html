<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Romaneio Cia do Corte</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

</head>
<body>

<header>
  <h1>Romaneio Cia do Corte</h1>
</header>

<main>
  <section class="box">
    <label>Cliente</label>
    <input id="cliente" placeholder="Nome do cliente">

    <label>Modelo</label>
    <input id="modelo" placeholder="Ex: Camiseta Básica">

    <label>Preço por peça (R$)</label>
    <input id="preco" type="number" step="0.01">

    
    <label>Cor</label>
<input id="cor" placeholder="Ex: Preta">

<label>Tamanhos (preencha só o que usar)</label>

<div class="grade">
  <input type="number" placeholder="P" id="tP">
  <input type="number" placeholder="M" id="tM">
  <input type="number" placeholder="G" id="tG">
  <input type="number" placeholder="GG" id="tGG">
  <input type="number" placeholder="XGG" id="tXGG">

  <input type="number" placeholder="34" id="t34">
  <input type="number" placeholder="36" id="t36">
  <input type="number" placeholder="38" id="t38">
  <input type="number" placeholder="40" id="t40">
  <input type="number" placeholder="42" id="t42">
  <input type="number" placeholder="44" id="t44">
  <input type="number" placeholder="46" id="t46">
  <input type="number" placeholder="48" id="t48">
  <input type="number" placeholder="50" id="t50">
  <input type="number" placeholder="52" id="t52">
  <input type="number" placeholder="54" id="t54">
  <input type="number" placeholder="56" id="t56">
</div>
